{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Create your account</h2>

  <form method="post" enctype="multipart/form-data" action="{% url 'accounts:sign_up' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>

  <!-- Optional link below the form -->
  <a href="{% url 'shop:product_list' %}" class="btn btn-secondary mt-3">Back to Shop</a>
</div>
{% endblock %}
