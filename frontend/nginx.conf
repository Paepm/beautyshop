# -----------------------------------------------------
# 1) HTTP  ➜  HTTPS
# -----------------------------------------------------
server {
    listen 80;
    server_name coffee-crew.at www.coffee-crew.at;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------
# 2) HTTPS-Host
# -----------------------------------------------------
server {
    listen 443 ssl http2;
    server_name coffee-crew.at www.coffee-crew.at;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/coffee-crew.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee-crew.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Dokument-Wurzel (SPA)
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Media-Files aus Django
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # API an Django-Backend weiterleiten
    location /api/ {
        proxy_pass         http://backend:8000/api/;   # Container-Name prüfen!
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------
    # Schutz sensibler Dateien
    # -------------------------------------------------
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(py|json|lock|cfg|ini|bak|swp|sql|yml)$ { deny all; }

    # -------------------------------------------------
    # Security-Header
    # -------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=()"        always;

    # Content-Security-Policy – eine einzige Zeichenkette
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://coffee-crew.at wss://coffee-crew.at;" always;

}
