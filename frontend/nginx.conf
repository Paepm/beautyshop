# -----------------------------------------------------
# 1) HTTP  ➜  HTTPS
# -----------------------------------------------------
server {
    listen 80;
    server_name coffee-crew.at www.coffee-crew.at;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------
# 2) HTTPS-Host – HART GEHÄRTET
# -----------------------------------------------------
server {
    listen 443 ssl; 
    http2 on;
    server_name coffee-crew.at www.coffee-crew.at;

    # ───── TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_ecdh_curve X25519:P-256:P-384;
    ssl_stapling on;
    ssl_stapling_verify on;


    # ───── Limits
    client_max_body_size 20M;

    # ───── Dokument-Wurzel
    root  /usr/share/nginx/html;
    index index.html;

    # ───── React SPA
    location / {
        try_files $uri /index.html;
    }

    # ───── Media-Files
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # ───── Statics (React)
    location ~* \.(css|js|json|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.html;
    }

    # ───── API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ───── Exploit-Pfade hart blocken
    location ~* /(sra_|owa|wp-|FUZZ|\.\.|\.php|\.aspx)$ { return 444; }

    # ───── Schutz sensibler Dateien
    location ~ /\.(?!well-known) { return 444; }
    location ~* \.(py|json|lock|cfg|ini|bak|swp|sql|yml)$ { return 444; }

    # ───── Security-Header
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options       "nosniff"                            always;
    add_header X-Frame-Options              "SAMEORIGIN"                         always;
    add_header X-XSS-Protection             "1; mode=block"                      always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy           "geolocation=(), microphone=()"      always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                        always;
    add_header Cross-Origin-Embedder-Policy "require-corp"                       always;
    add_header Cross-Origin-Resource-Policy "same-origin"                        always;
    add_header Content-Security-Policy "
      default-src 'self';
      script-src  'self' 'unsafe-inline';
      style-src   'self' 'unsafe-inline';
      img-src     'self' data:;
      font-src    'self' data:;
      connect-src 'self' https://coffee-crew.at wss://coffee-crew.at;
    " always;

    # ───── Custom Error Page
    error_page 403 404 500 502 503 504 /error.html;
    location = /error.html { root /usr/share/nginx/html; internal; }
}
