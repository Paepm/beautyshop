{% extends 'base.html' %}
{% load static %}

{% block title %}Payment with Stripe{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Secure Stripe Payment</h2>
  <form id="payment-form">
    <div id="card-element"><!-- Stripe injects the card input here --></div>
    <div id="card-errors" role="alert" class="text-danger mt-2"></div>
    <button id="submit" class="btn btn-success mt-3">Pay</button>
  </form>
</div>

<!-- Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe("{{ stripe_public_key }}");
  const elements = stripe.elements();
  const cardElement = elements.create("card");
  cardElement.mount("#card-element");

  const form = document.getElementById("payment-form");
  const clientSecret = "{{ client_secret }}";

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    // Optional: disable button while processing
    document.getElementById("submit").disabled = true;

    const { paymentIntent, error } = await stripe.confirmCardPayment(clientSecret, {
      payment_method: {
        card: cardElement,
      },
    });

    if (error) {
      // 💥 Fehler auf der Karte (z. B. abgelehnt)
      console.error("Payment error:", error.message);
      // Weiterleitung zur Fehlerseite
      window.location.href = "{% url 'payments:error_payment' %}";
    } else {
      if (paymentIntent.status === "succeeded") {
        // ✅ Redirect zur "Bestellung abschließen"-View
        window.location.href = "{% url 'orders:create_order_after_payment' %}";
      } else {
        // ⚠️ Falls aus irgendeinem Grund nicht succeeded (z. B. benötigt 3D Secure)
        console.warn("Payment not completed:", paymentIntent.status);
        window.location.href = "{% url 'payments:error_payment' %}";
      }
    }
  });
</script>

{% endblock %}
