{% extends 'base.html' %}
{% load static %}

{% block title %}Payment with Stripe{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Secure Stripe Payment</h2>
  <form id="payment-form">
    <div id="card-element"><!-- Stripe injects the card input here --></div>
    <div id="card-errors" role="alert" class="text-danger mt-2"></div>
    <button id="submit" class="btn btn-success mt-3">Pay</button>
  </form>
  <div id="processing-message" class="mt-3 text-info" style="display: none;">
    Processing your payment... Please wait.
  </div>
</div>

<!-- Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe("{{ stripe_public_key }}");
  const elements = stripe.elements();
  const cardElement = elements.create("card");
  cardElement.mount("#card-element");

  const form = document.getElementById("payment-form");
  const submitButton = document.getElementById("submit");
  const processingMessage = document.getElementById("processing-message");
  const errorDiv = document.getElementById("card-errors");
  const clientSecret = "{{ client_secret }}";

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    submitButton.disabled = true;
    processingMessage.style.display = "block";
    errorDiv.textContent = "";

    const { paymentIntent, error } = await stripe.confirmCardPayment(clientSecret, {
      payment_method: {
        card: cardElement,
      }
    });

    if (error) {
      console.error("Stripe payment error:", error.message);
      errorDiv.textContent = error.message;

      // Optional: Re-enable button for retry
      submitButton.disabled = false;
      processingMessage.style.display = "none";

    } else if (paymentIntent && paymentIntent.status === "succeeded") {
      // Successful payment – continue
      window.location.href = "{% url 'orders:create_order_after_payment' %}";
    } else {
      // Any unexpected state
      errorDiv.textContent = "Payment not completed. Please try again.";
      console.warn("Unexpected paymentIntent status:", paymentIntent?.status);
      submitButton.disabled = false;
      processingMessage.style.display = "none";
    }
  });
</script>
{% endblock %}
