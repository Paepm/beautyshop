<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
</head>

<body style="margin:0; padding:0; background-color:#f9fafb; font-family:Arial, sans-serif;">

    <div
        style="max-width:600px; margin:40px auto; background:white; border-radius:0.5rem; overflow:hidden; box-shadow:0 0 10px rgba(0,0,0,0.05);">

        <div style="background-color:#4f46e5; padding:1.5rem; text-align:center;">
            <img src="media/shop_page/WohnsSinn_logo1.png" alt="">
            <h1 style="color:white; font-size:1.5rem; font-weight:bold;"> WohnSinnn Notification </h1>
        </div>

        <div style="padding:2rem; color:#111827; font-size:1rem; line-height:1.5;">
            {% block content %}
            <p style="margin-bottom:1rem;">Hello,</p>
            <p style="margin-bottom:1rem;">This is a base email for your Beautyshop platform.</p>
            {% endblock %}
        </div>

        <div style="padding:2rem; text-align:center;">
            <a href="{{ cta_url|default:'#' }}"
                style="display:inline-block; background-color:#4f46e5; color:white; padding:0.75rem 1.5rem; text-decoration:none; border-radius:0.375rem;">
                {{ cta_text|default:"Open Beautyshop" }}
            </a>
        </div>

        <div style="background-color:#f3f4f6; text-align:center; font-size:0.875rem; color:#6b7280; padding:1.5rem;">
            &copy; {{ current_year }} Beautyshop. All rights reserved.
        </div>
    </div>

</body>

</html>
